<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            padding-top: 80px;
        }

        .quiz-box {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        #questionNumber {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        #question {
            font-size: 21px;
            margin-bottom: 20px;
        }

        .option {
            background-color: #eeeeee;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .option input {
            margin-right: 8px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
        }

        #nextBtn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #2878ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            color: red;
            margin-top: 15px;
        }

        #finalResult {
            display: none;
            text-align: center;
        }

        #finalResult h2 {
            margin-bottom: 15px;
        }

        #scoreText {
            font-size: 22px;
            margin-bottom: 20px;
        }

        #restartBtn {
            padding: 10px 25px;
            border: none;
            background-color: green;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="quiz-box">

        <div id="quiz">

            <h1>JavaScript Quiz</h1>

            <p id="questionNumber"></p>

            <h2 id="question"></h2>

            <div id="options"></div>

            <button id="nextBtn">Next Question</button>

            <p id="message"></p>

        </div>


        <div id="finalResult">

            <h2>Quiz Completed 🎉</h2>

            <p id="scoreText"></p>

            <button id="restartBtn">
                Restart Quiz
            </button>

        </div>

    </div>


    <script>

        const questions = [

            {
                question: "Which language makes a website interactive?",

                options: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "Photoshop"
                ],

                answer: "JavaScript"
            },


            {
                question: "Which tag is used to add JavaScript in HTML?",

                options: [
                    "<style>",
                    "<script>",
                    "<js>",
                    "<javascript>"
                ],

                answer: "<script>"
            },


            {
                question: "Which keyword creates a variable in JavaScript?",

                options: [
                    "let",
                    "style",
                    "html",
                    "link"
                ],

                answer: "let"
            },


            {
                question: "Which method selects an element by ID?",

                options: [
                    "getElementById",
                    "getClass",
                    "getHTML",
                    "selectId"
                ],

                answer: "getElementById"
            },


            {
                question: "Which event is used for a button click?",

                options: [
                    "hover",
                    "change",
                    "click",
                    "load"
                ],

                answer: "click"
            }

        ];


        const quiz = document.getElementById("quiz");

        const questionNumber =
            document.getElementById("questionNumber");

        const question =
            document.getElementById("question");

        const options =
            document.getElementById("options");

        const nextBtn =
            document.getElementById("nextBtn");

        const message =
            document.getElementById("message");

        const finalResult =
            document.getElementById("finalResult");

        const scoreText =
            document.getElementById("scoreText");

        const restartBtn =
            document.getElementById("restartBtn");


        let currentQuestion = 0;

        let score = 0;


        function showQuestion() {

            message.innerText = "";

            options.innerHTML = "";


            questionNumber.innerText =
                "Question " +
                (currentQuestion + 1) +
                " of " +
                questions.length;


            question.innerText =
                questions[currentQuestion].question;


            const currentOptions =
                questions[currentQuestion].options;


            currentOptions.forEach(function (option) {

                const optionBox =
                    document.createElement("div");

                optionBox.classList.add("option");


                const radio =
                    document.createElement("input");

                radio.type = "radio";
                radio.name = "answer";
                radio.value = option;


                const label =
                    document.createElement("label");

                label.innerText = option;


                optionBox.appendChild(radio);

                optionBox.appendChild(label);

                options.appendChild(optionBox);

            });


            if (currentQuestion === questions.length - 1) {

                nextBtn.innerText = "Finish Quiz";

            } else {

                nextBtn.innerText = "Next Question";

            }

        }


        nextBtn.addEventListener("click", function () {

            const selectedAnswer =
                document.querySelector(
                    'input[name="answer"]:checked'
                );


            if (selectedAnswer === null) {

                message.innerText =
                    "Please select an answer";

                return;
            }


            if (
                selectedAnswer.value ===
                questions[currentQuestion].answer
            ) {

                score = score + 1;

            }


            currentQuestion = currentQuestion + 1;


            if (currentQuestion < questions.length) {

                showQuestion();

            } else {

                showResult();

            }

        });


        function showResult() {

            quiz.style.display = "none";

            finalResult.style.display = "block";


            scoreText.innerText =
                "Your Score: " +
                score +
                " / " +
                questions.length;

        }


        restartBtn.addEventListener("click", function () {

            currentQuestion = 0;

            score = 0;

            quiz.style.display = "block";

            finalResult.style.display = "none";

            showQuestion();

        });


        showQuestion();

    </script>

</body>

</html>
